[package]
name = "rp-wheel-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = {
    version = "0.10.0",
    features = ["defmt"]
}

embassy-time = {
    version = "0.5.1",
    features = [
        "defmt",
        "defmt-timestamp-uptime",
    ]
}

embassy-rp = {
    version = "0.10.0",
    features = [
        "defmt",
        "rp235xa",
        "time-driver",
        "critical-section-impl",
        "executor-thread",
        "binary-info",
    ]
}

embassy-usb = {
    version = "0.6.0",
    features = ["defmt"]
}

embassy-usb-logger = "0.6.0"

cortex-m = {
    version = "0.7.9",
    features = ["inline-asm"]
}

cortex-m-rt = "0.7.6"

defmt = "1.1.1"
defmt-rtt = "1.3.0"

log = "0.4"

panic-probe = {
    version = "1.0.0",
    features = ["print-defmt"]
}

[profile.dev]
debug = 2
opt-level = 1

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 2

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.release.build-override]
debug = false
opt-level = 0