[package]
name = "rp-wheel-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = {
    version = "0.10.0",
    features = ["defmt"]
}

embassy-time = {
    version = "0.5.1",
    features = [
        "defmt",
        "defmt-timestamp-uptime",
    ]
}

embassy-rp = {
    version = "0.10.0",
    features = [
        "defmt",
        "rp235xa",
        "time-driver",
        "critical-section-impl",
        "executor-thread",
        "binary-info",
    ]
}

embassy-usb = {
    version = "0.6.0",
    features = ["defmt"]
}

# Log output on UART0 (src/uart_log.rs).
embassy-sync = "0.8.0"
embedded-io-async = "0.7.0"
critical-section = "1.2.0"

# USB host on the USB-A port (PIO USB, GPIO12/GPIO13).
# Versions pinned to the same Embassy release line as embassy-rp 0.10 / embassy-usb 0.6.
rp-pio-usb-host = {
    version = "0.1.0",
    features = ["rp235xa"]
}

# `log` (not `defmt`) so the host stack's own warnings go to the USB CDC logger.
embassy-usb-host = {
    version = "0.1.0",
    features = ["log"]
}

embassy-usb-driver = "0.2.2"

# Already in the tree via embassy-usb; used directly for select/join.
embassy-futures = "0.1.2"

static_cell = "2.1.1"

cortex-m = {
    version = "0.7.9",
    features = ["inline-asm"]
}

cortex-m-rt = "0.7.6"

defmt = "1.1.1"
defmt-rtt = "1.3.0"

log = "0.4"

panic-probe = {
    version = "1.0.0",
    features = ["print-defmt"]
}

[profile.dev]
debug = 2
opt-level = 1

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 2

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.release.build-override]
debug = false
opt-level = 0

# Fork of rp-pio-usb-host (branch sof-during-transfers): hardware-timed SOF, SOFs during
# transfers, stage-by-stage control transfers.
[patch.crates-io]
rp-pio-usb-host = { git = "https://github.com/ghj1214kr/rp-pio-usb-host", rev = "592348c6e04b1613b17bc144551e3ae8810e88c4" }
